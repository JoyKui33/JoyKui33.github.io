---
layout: base
---
<section class="post">
  <div class="wrap">
    <div class="meta">{{ page.date | date: "%d %b %Y" }}{% if page.tags %} · {{ page.tags | join: " · " }}{% endif %}</div>
    <h1>{{ page.title }}</h1>
    <article class="prose">
      {{ content }}
    </article>
    <a class="back" href="{{ '/writing/' | relative_url }}">← all writing</a>
  </div>
</section>
