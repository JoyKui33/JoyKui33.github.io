<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {% endif %}Joy Wangui</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<div class="glow" id="glow"></div>
<header>
  <div class="wrap bar">
    <a class="mark" href="{{ '/' | relative_url }}" style="color:var(--ink)">JOY WANGUI</a>
    <div class="nav-r">
      <nav>
        <a href="{{ '/#about' | relative_url }}">about</a>
        <a href="{{ '/#work' | relative_url }}">work</a>
        <a href="{{ '/writing/' | relative_url }}">writing</a>
        <a href="{{ '/#contact' | relative_url }}">contact</a>
      </nav>
      <button class="toggle" id="themeToggle" aria-label="Toggle dark mode">◐ dark</button>
    </div>
  </div>
</header>
{{ content }}
<footer>
  <div class="wrap f">
    <span>© <span id="yr"></span> Joy Wangui · built &amp; maintained by hand</span>
    <span>kui@infra ~ % logout</span>
  </div>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
